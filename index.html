<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Seminar Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>IT Seminar Registration</h1>
    <p class="subtitle">Please fill out the form below to register for the upcoming IT seminar.</p>

    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          required 
          aria-describedby="fullNameError"
        >
        <span id="fullNameError" class="error-message" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="studentNumber">Student Number (e.g., 24-1234-123)</label>
        <input 
          type="text" 
          id="studentNumber" 
          name="studentNumber" 
          required 
          aria-describedby="studentNumberError"
        >
        <span id="studentNumberError" class="error-message" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          aria-describedby="emailError"
        >
        <span id="emailError" class="error-message" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="mobileNumber">Mobile Number (e.g., 09123456789 or +639123456789)</label>
        <input 
          type="tel" 
          id="mobileNumber" 
          name="mobileNumber" 
          required 
          aria-describedby="mobileNumberError"
        >
        <span id="mobileNumberError" class="error-message" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          aria-describedby="passwordError passwordFeedback"
        >
        <span id="passwordFeedback" class="feedback-message" aria-live="polite"></span>
        <span id="passwordError" class="error-message" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          required 
          aria-describedby="confirmPasswordError"
        >
        <span id="confirmPasswordError" class="error-message" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="course">Course</label>
        <select id="course" name="course" required aria-describedby="courseError">
          <option value="" disabled selected>Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <span id="courseError" class="error-message" aria-live="polite"></span>
      </div>

      <div class="form-group checkbox-group">
        <label for="terms">
          <input 
            type="checkbox" 
            id="terms" 
            name="terms" 
            required 
            aria-describedby="termsError"
          >
          I agree to the terms and conditions
        </label>
        <span id="termsError" class="error-message" aria-live="polite"></span>
      </div>

      <div class="button-group">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <div id="successMessage" class="success-message" aria-live="polite"></div>

    <div id="registrationSummary" class="summary-container" hidden>
      <h2>Registration Summary</h2>
      <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
      <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
      <p><strong>Email Address:</strong> <span id="summaryEmail"></span></p>
      <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
      <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
